<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Rotator</title>
  <!-- Link external CSS file -->
  <link rel="stylesheet" href="image rotator.css">
</head>
<body>

  <!-- Container to center the image and button -->
  <div class="container">
    <!-- Image to be rotated -->
    <img id="image" src="https://stimg.cardekho.com/images/carexteriorimages/930x620/BMW/M4-Competition/8049/1644496825816/front-left-side-47.jpg" alt="BMW M4 Competition">

    <!-- Button below the image to trigger rotation -->
    <button id="rotateBtn">Rotate</button>
  </div>

  <!-- Link external JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
